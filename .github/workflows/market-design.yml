name: Implement Market Design

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write market dashboard
        shell: bash
        run: |
          cat > app/src/main/java/ke/co/nsewatcher/MarketDashboard.kt <<'KOTLIN'
          package ke.co.nsewatcher

          import androidx.compose.foundation.BorderStroke
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.itemsIndexed
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import coil3.compose.AsyncImage
          import java.util.Locale

          private val MarketBg = Color(0xFF061326)
          private val MarketCard = Color(0xFF0D1D32)
          private val MarketCard2 = Color(0xFF10233A)
          private val MarketGreen = Color(0xFF12E889)
          private val MarketBlue = Color(0xFF9DB6E0)
          private val MarketWhite = Color(0xFFF7FAFF)
          private val MarketMuted = Color(0xFF91A7CC)
          private val MarketBorder = Color(0xFF1B3654)

          private val MarketLogoAliases = mapOf(
              "SCOM" to "scom", "KCB" to "kcb", "EQTY" to "eqty", "ABSA" to "absa", "BOC" to "boc",
              "KEGN" to "kengen", "COOP" to "coop", "EABL" to "eabl", "NCBA" to "ncba", "KPLC" to "kplc",
              "BRIT" to "brit", "KQ" to "kq", "BAT" to "bat", "JUB" to "jub", "DTK" to "dtk"
          )

          @Composable
          fun MarketDashboard(stockFeed: List<Stock>) {
              var period by rememberSaveable { mutableStateOf("Weekly") }
              val top = remember(stockFeed, period) {
                  stockFeed.filter { it.price.isFinite() && it.change.isFinite() }
                      .sortedByDescending { it.change }
                      .take(5)
              }
              val average = top.map { it.change }.average().takeIf { it.isFinite() } ?: 0.0

              Box(Modifier.fillMaxSize().background(MarketBg)) {
                  LazyColumn(
                      modifier = Modifier.fillMaxSize(),
                      contentPadding = PaddingValues(start = 16.dp, top = 12.dp, end = 16.dp, bottom = 20.dp),
                      verticalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      item {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Icon(Icons.Default.ShowChart, null, tint = MarketGreen, modifier = Modifier.size(43.dp))
                              Spacer(Modifier.width(6.dp))
                              Text("Market", color = MarketWhite, fontSize = 30.sp, fontWeight = FontWeight.ExtraBold)
                          }
                          Text("Top performing companies on the NSE", color = MarketBlue, fontSize = 15.sp, modifier = Modifier.padding(top = 3.dp))
                      }

                      item {
                          Surface(
                              Modifier.fillMaxWidth().height(55.dp),
                              RoundedCornerShape(28.dp),
                              color = Color(0xFF0B1930),
                              border = BorderStroke(1.dp, MarketBorder)
                          ) {
                              Row(Modifier.fillMaxSize()) {
                                  listOf("Weekly", "Monthly", "3M", "6M", "1Y").forEachIndexed { index, label ->
                                      val selected = period == label
                                      Box(
                                          Modifier.weight(1f).fillMaxHeight().clip(RoundedCornerShape(28.dp)).clickable { period = label },
                                          contentAlignment = Alignment.Center
                                      ) {
                                          if (selected) {
                                              Box(Modifier.fillMaxSize().padding(1.dp).clip(RoundedCornerShape(28.dp)).background(MarketGreen))
                                          }
                                          Text(label, color = if (selected) MarketWhite else MarketBlue, fontSize = 15.sp, fontWeight = if (selected) FontWeight.Bold else FontWeight.Medium)
                                      }
                                  }
                              }
                          }
                      }

                      item {
                          Surface(
                              Modifier.fillMaxWidth(),
                              RoundedCornerShape(18.dp),
                              color = Color(0xFF0A2630),
                              border = BorderStroke(1.dp, Color(0xFF08705E))
                          ) {
                              Row(Modifier.padding(15.dp), verticalAlignment = Alignment.CenterVertically) {
                                  Surface(Modifier.size(62.dp), CircleShape, Color(0xFF087451)) {
                                      Box(Modifier.fillMaxSize(), Alignment.Center) { Icon(Icons.Default.EmojiEvents, null, tint = Color.White, modifier = Modifier.size(35.dp)) }
                                  }
                                  Spacer(Modifier.width(14.dp))
                                  Column(Modifier.weight(1f)) {
                                      Text("Top Performers (This $period)", color = MarketWhite, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                                      Text("Companies with the highest price gains", color = MarketBlue, fontSize = 11.sp, modifier = Modifier.padding(top = 4.dp))
                                  }
                                  Column(horizontalAlignment = Alignment.End) {
                                      Text("↑ ${String.format(Locale.US, "%+.1f%%", average)}", color = MarketGreen, fontSize = 19.sp, fontWeight = FontWeight.Bold)
                                      Text("Avg. gain (Top 5)", color = MarketBlue, fontSize = 10.sp, modifier = Modifier.padding(top = 3.dp))
                                  }
                              }
                          }
                      }

                      item {
                          Row(Modifier.fillMaxWidth().padding(horizontal = 8.dp), verticalAlignment = Alignment.CenterVertically) {
                              Text("#", color = MarketBlue, fontSize = 12.sp, fontWeight = FontWeight.Bold, modifier = Modifier.width(34.dp))
                              Text("Company", color = MarketBlue, fontSize = 12.sp, fontWeight = FontWeight.Bold, modifier = Modifier.weight(1f))
                              Text("Price (KES)", color = MarketBlue, fontSize = 12.sp, fontWeight = FontWeight.Bold, modifier = Modifier.width(92.dp))
                              Text("Gain", color = MarketBlue, fontSize = 12.sp, fontWeight = FontWeight.Bold, modifier = Modifier.width(54.dp))
                          }
                      }

                      itemsIndexed(top) { index, stock -> MarketPerformerRow(index + 1, stock) }

                      item {
                          Surface(
                              Modifier.fillMaxWidth(),
                              RoundedCornerShape(17.dp),
                              color = Color(0xFF0A2630),
                              border = BorderStroke(1.dp, Color(0xFF08705E))
                          ) {
                              Row(Modifier.padding(14.dp), verticalAlignment = Alignment.CenterVertically) {
                                  Surface(Modifier.size(60.dp), CircleShape, Color(0xFF087451)) {
                                      Box(Modifier.fillMaxSize(), Alignment.Center) { Icon(Icons.Default.ShowChart, null, tint = MarketGreen, modifier = Modifier.size(34.dp)) }
                                  }
                                  Spacer(Modifier.width(14.dp))
                                  Column(Modifier.weight(1f)) {
                                      Text("Track what's moving the market", color = MarketWhite, fontSize = 15.sp, fontWeight = FontWeight.Medium)
                                      Text("Stay informed with the top gainers and losers, updated regularly.", color = MarketBlue, fontSize = 10.sp, modifier = Modifier.padding(top = 4.dp))
                                  }
                                  Icon(Icons.Default.ChevronRight, null, tint = MarketBlue, modifier = Modifier.size(28.dp))
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          private fun MarketPerformerRow(rank: Int, stock: Stock) {
              val logo = stock.logoUrl?.takeIf { it.isNotBlank() }
                  ?: "https://mystocks.africa/logos/${MarketLogoAliases[stock.symbol.uppercase(Locale.US)] ?: stock.symbol.lowercase(Locale.US)}-ke.svg"
              Surface(
                  Modifier.fillMaxWidth(),
                  RoundedCornerShape(17.dp),
                  color = MarketCard,
                  border = BorderStroke(1.dp, MarketBorder)
              ) {
                  Row(Modifier.padding(horizontal = 12.dp, vertical = 10.dp), verticalAlignment = Alignment.CenterVertically) {
                      Surface(Modifier.size(38.dp), CircleShape, MarketCard2) {
                          Box(Modifier.fillMaxSize(), Alignment.Center) { Text(rank.toString(), color = MarketWhite, fontSize = 16.sp, fontWeight = FontWeight.Medium) }
                      }
                      Spacer(Modifier.width(10.dp))
                      Surface(Modifier.size(62.dp), RoundedCornerShape(14.dp), Color.White) {
                          AsyncImage(model = logo, contentDescription = stock.name, modifier = Modifier.fillMaxSize().padding(5.dp))
                      }
                      Spacer(Modifier.width(11.dp))
                      Column(Modifier.weight(1f)) {
                          Text(stock.name, color = MarketWhite, fontSize = 14.sp, fontWeight = FontWeight.Bold, maxLines = 1)
                          Text(stock.symbol, color = MarketBlue, fontSize = 12.sp, fontWeight = FontWeight.Medium, modifier = Modifier.padding(top = 2.dp))
                          Text(stock.sector.ifBlank { "Other" }, color = MarketBlue, fontSize = 10.sp, modifier = Modifier.padding(top = 2.dp), maxLines = 1)
                      }
                      Text("KES ${String.format(Locale.US, "%.2f", stock.price)}", color = MarketWhite, fontSize = 13.sp, fontWeight = FontWeight.Medium, modifier = Modifier.width(88.dp))
                      Text("▲ ${String.format(Locale.US, "%+.2f%%", stock.change)}", color = MarketGreen, fontSize = 13.sp, fontWeight = FontWeight.Bold, modifier = Modifier.width(61.dp))
                  }
              }
          }
          KOTLIN

      - name: Wire market dashboard and remove old market UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/ke/co/nsewatcher/DesignActivity.kt')
          s = p.read_text()
          old = 'Page.HOME,Page.MARKET,Page.NEWS,Page.COMPANIES,Page.PAPER,Page.MORE -> Scaffold(topBar={if(page!=Page.HOME) TopBar(name,::go)},bottomBar={BottomNav(tab){tab=it;history=emptyList();page=when(it){0->Page.HOME;1->Page.MARKET;2->Page.NEWS;3->Page.COMPANIES;else->Page.MORE}}}){pad->Box(Modifier.fillMaxSize().padding(pad)){when(page){Page.HOME->HomeDashboard(stocks,{selected=it;go(Page.COMPANY)},{selectedNews=it;go(Page.NEWS_DETAIL)});Page.MARKET->Market();Page.NEWS->NewsDashboard{selectedNews=it;go(Page.NEWS_DETAIL)};Page.COMPANIES->Companies{selected=it;go(Page.COMPANY)};Page.PAPER->Paper();else->More(::go)}}}'
          new = 'Page.HOME,Page.MARKET,Page.NEWS,Page.COMPANIES,Page.PAPER,Page.MORE -> Scaffold(topBar={if(page!=Page.HOME && page!=Page.MARKET) TopBar(name,::go)},bottomBar={BottomNav(tab){tab=it;history=emptyList();page=when(it){0->Page.HOME;1->Page.MARKET;2->Page.NEWS;3->Page.COMPANIES;else->Page.MORE}}}){pad->Box(Modifier.fillMaxSize().padding(pad)){when(page){Page.HOME->HomeDashboard(stocks,{selected=it;go(Page.COMPANY)},{selectedNews=it;go(Page.NEWS_DETAIL)});Page.MARKET->MarketDashboard(stocks);Page.NEWS->NewsDashboard{selectedNews=it;go(Page.NEWS_DETAIL)};Page.COMPANIES->Companies{selected=it;go(Page.COMPANY)};Page.PAPER->Paper();else->More(::go)}}}'
          if old not in s:
              raise SystemExit('market route block not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build redesigned market screen
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.14.4
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.14.4-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$GITHUB_WORKSPACE/gradle-8.14.4/bin" >> "$GITHUB_PATH"

      - name: Compile APK
        run: gradle --no-daemon assembleDebug

      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/market-design.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ke/co/nsewatcher/MarketDashboard.kt app/src/main/java/ke/co/nsewatcher/DesignActivity.kt .github/workflows/market-design.yml
          git commit -m "feat: replace market section with approved design"
          git push origin HEAD:main
