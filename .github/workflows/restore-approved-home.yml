name: Restore approved Home design

on:
  push:
    paths:
      - '.github/workflows/restore-approved-home.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Restore approved Home implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          hp = Path('app/src/main/java/ke/co/nsewatcher/HomeDashboard.kt')
          s = hp.read_text()

          # Fix the accidental apostrophe in the Kotlin composable/function name.
          s = s.replace("Today'sIntelligence", "TodaysIntelligence")

          # Restore the Border modifier import used by the evidence chips.
          if 'import androidx.compose.foundation.border' not in s:
              s = s.replace('import androidx.compose.foundation.background\n', 'import androidx.compose.foundation.background\nimport androidx.compose.foundation.border\n', 1)

          # Keep the approved reference hero proportions and skyline treatment.
          s = s.replace('.height(366.dp)', '.height(366.dp)', 1)

          # Restore the reference index presentation: value + movement + daily delta, with the chart.
          pattern = re.compile(r'Spacer\\(Modifier\\.height\\(12\\.dp\\)\\)\\s*Row\\(verticalAlignment = Alignment\\.Bottom\\).*?MiniIndexChart\\(\\)', re.S)
          replacement = '''Spacer(Modifier.height(12.dp))
                Row(verticalAlignment = Alignment.Bottom) {
                    Text("181.74", color = Color.White, fontSize = 31.sp, fontWeight = FontWeight.ExtraBold)
                    Spacer(Modifier.width(7.dp))
                    Column {
                        Text("▲ +0.84%", color = Color(0xFF58E8A8), fontSize = 13.sp, fontWeight = FontWeight.Bold)
                        Text("(+1.52)", color = Color(0xFFA8E7C8), fontSize = 9.sp)
                    }
                }
                MiniIndexChart()'''
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('Reference index block was not found')

          hp.write_text(s)

          dp = Path('app/src/main/java/ke/co/nsewatcher/DesignActivity.kt')
          d = dp.read_text()
          old = 'Scaffold(topBar={TopBar(name,::go)},bottomBar={BottomNav(tab){tab=it;history=emptyList();page=when(it){0->Page.HOME;1->Page.MARKET;2->Page.NEWS;3->Page.COMPANIES;else->Page.MORE}}})'
          new = 'Scaffold(topBar={if(page!=Page.HOME) TopBar(name,::go)},bottomBar={BottomNav(tab){tab=it;history=emptyList();page=when(it){0->Page.HOME;1->Page.MARKET;2->Page.NEWS;3->Page.COMPANIES;else->Page.MORE}}})'
          if old in d:
              d = d.replace(old, new, 1)
          else:
              # Fail rather than silently leaving the duplicate top bar if the expected scaffold changed.
              if 'Scaffold(topBar={TopBar(name,::go)}' in d:
                  raise SystemExit('Found duplicate Home top bar but could not replace scaffold')
          dp.write_text(d)
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.14.4-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$GITHUB_WORKSPACE/gradle-8.14.4/bin" >> "$GITHUB_PATH"

      - name: Build full project
        run: gradle --no-daemon build

      - name: Commit restored Home and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ke/co/nsewatcher/HomeDashboard.kt app/src/main/java/ke/co/nsewatcher/DesignActivity.kt
          git commit -m "Restore approved Home dashboard design"
          git rm .github/workflows/restore-approved-home.yml
          git commit -m "Remove temporary Home restore workflow"
          git push origin HEAD:main
