name: Connect movement intelligence UI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connect:
    if: ${{ !contains(github.event.head_commit.message, 'Connect movement intelligence UI') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert movement section into Company Intelligence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/ke/co/nsewatcher/CompanyIntelligence.kt')
          text = path.read_text()
          marker = '        item { SectionTitle("What changed?", "Recent company events and intelligence", Icons.Default.Newspaper) }'
          insertion = '        item { WhyStockMovingSection(s.symbol) }\n'
          if 'WhyStockMovingSection(s.symbol)' not in text:
              if marker not in text:
                  raise SystemExit('Target marker not found')
              text = text.replace(marker, insertion + '\n' + marker, 1)
              path.write_text(text)
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ke/co/nsewatcher/CompanyIntelligence.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Connect movement intelligence UI [skip ci]'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/insert-movement-ui.yml
          git commit -m 'Remove temporary movement UI workflow [skip ci]'
          git push
