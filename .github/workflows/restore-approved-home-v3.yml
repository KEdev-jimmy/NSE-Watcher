name: Restore approved Home design v3

on:
  push:
    paths:
      - '.github/workflows/restore-approved-home-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Apply approved Home fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          hp = Path('app/src/main/java/ke/co/nsewatcher/HomeDashboard.kt')
          s = hp.read_text()
          s = s.replace("Today'sIntelligence", "TodaysIntelligence")
          if 'import androidx.compose.foundation.border' not in s:
              s = s.replace('import androidx.compose.foundation.background\n', 'import androidx.compose.foundation.background\nimport androidx.compose.foundation.border\n', 1)

          marker = '@Composable\nprivate fun MarketIndexCard'
          start_fn = s.index(marker)
          start = s.index('Row(verticalAlignment = Alignment.Bottom)', start_fn)
          end = s.index('MiniIndexChart()', start) + len('MiniIndexChart()')
          replacement = '''Row(verticalAlignment = Alignment.Bottom) {
                    Text("181.74", color = Color.White, fontSize = 31.sp, fontWeight = FontWeight.ExtraBold)
                    Spacer(Modifier.width(7.dp))
                    Column {
                        Text("▲ +0.84%", color = Color(0xFF58E8A8), fontSize = 13.sp, fontWeight = FontWeight.Bold)
                        Text("(+1.52)", color = Color(0xFFA8E7C8), fontSize = 9.sp)
                    }
                }
                MiniIndexChart()'''
          s = s[:start] + replacement + s[end:]
          hp.write_text(s)

          dp = Path('app/src/main/java/ke/co/nsewatcher/DesignActivity.kt')
          d = dp.read_text()
          old = 'Scaffold(topBar={TopBar(name,::go)},bottomBar={BottomNav(tab){tab=it;history=emptyList();page=when(it){0->Page.HOME;1->Page.MARKET;2->Page.NEWS;3->Page.COMPANIES;else->Page.MORE}}})'
          new = 'Scaffold(topBar={if(page!=Page.HOME) TopBar(name,::go)},bottomBar={BottomNav(tab){tab=it;history=emptyList();page=when(it){0->Page.HOME;1->Page.MARKET;2->Page.NEWS;3->Page.COMPANIES;else->Page.MORE}}})'
          if old in d:
              d = d.replace(old, new, 1)
          dp.write_text(d)
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.14.4-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$GITHUB_WORKSPACE/gradle-8.14.4/bin" >> "$GITHUB_PATH"

      - name: Build full project
        run: gradle --no-daemon build

      - name: Commit Home restore and clean temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ke/co/nsewatcher/HomeDashboard.kt app/src/main/java/ke/co/nsewatcher/DesignActivity.kt
          git commit -m "Restore approved Home dashboard design"
          git rm .github/workflows/restore-approved-home.yml .github/workflows/restore-approved-home-v2.yml .github/workflows/restore-approved-home-v3.yml .github/workflows/finish-home-reference.yml .github/workflows/restore-compact-home.yml 2>/dev/null || true
          git commit -m "Remove temporary Home restore workflows" || true
          git push origin HEAD:main
