name: Implement News design

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/implement-news-design.yml'

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Implement mobile News screen and Home index spacing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/ke/co/nsewatcher/DesignActivity.kt')
          s = p.read_text()

          # Home: add a tiny 2dp breathing space on both sides of the floating NSE index card.
          old_home = '''            MarketIndexCard(advancing, declining, unchanged, reportedVolume)'''
          new_home = '''            Box(Modifier.fillMaxWidth().padding(horizontal = 2.dp)) {
                MarketIndexCard(advancing, declining, unchanged, reportedVolume)
            }'''
          if old_home not in s:
              raise SystemExit('Home index card call not found')
          s = s.replace(old_home, new_home, 1)

          news_start = s.find('@Composable\nprivate fun News(open:(NewsItem)->Unit){')
          news_end = s.find('private data class NewsDisplayMeta', news_start)
          if news_start < 0 or news_end < 0:
              raise SystemExit('News function boundaries not found')

          news = r'''@Composable
private fun News(open:(NewsItem)->Unit){
    var items by remember { mutableStateOf(emptyList<NewsItem>()) }
    var loading by remember { mutableStateOf(true) }
    var error by remember { mutableStateOf<String?>(null) }
    var category by rememberSaveable { mutableStateOf("All") }

    LaunchedEffect(Unit) {
        loading = true
        val result = NewsCache.loadFeedResult()
        items = result.items.sortedByDescending { it.publishedAt }
        error = result.error
        loading = false
    }

    val categories = listOf("All", "Company News", "Dividends", "Market", "Corporate Actions", "Analysis")
    val filtered = if (category == "All") items else items.filter { it.category.equals(category, true) }
    val top = filtered.firstOrNull()
    val companyLinked = filtered.filter { it.symbol.isNotBlank() || it.companyName.isNotBlank() }
    val trending = companyLinked.drop(if (top != null && (top.symbol.isNotBlank() || top.companyName.isNotBlank())) 1 else 0).take(3)
    val latest = filtered.filter { candidate -> top?.id != candidate.id && trending.none { it.id == candidate.id } }.take(3)

    LazyColumn(
        contentPadding = PaddingValues(start = 14.dp, top = 4.dp, end = 14.dp, bottom = 22.dp),
        verticalArrangement = Arrangement.spacedBy(10.dp)
    ) {
        item {
            Header("News", "NSE companies, dividends & market intelligence")
        }

        item {
            Row(
                Modifier.horizontalScroll(rememberScrollState()),
                horizontalArrangement = Arrangement.spacedBy(7.dp)
            ) {
                categories.forEach { c ->
                    FilterChip(
                        selected = category == c,
                        onClick = { category = c },
                        label = { Text(c, fontSize = 10.sp, maxLines = 1) },
                        shape = RoundedCornerShape(12.dp)
                    )
                }
            }
        }

        if (loading) {
            item {
                Box(Modifier.fillMaxWidth().height(210.dp), contentAlignment = Alignment.Center) {
                    CircularProgressIndicator(color = Green)
                }
            }
        } else if (filtered.isEmpty()) {
            item {
                Card(
                    Modifier.fillMaxWidth(),
                    RoundedCornerShape(18.dp),
                    border = BorderStroke(1.dp, Border)
                ) {
                    Column(
                        Modifier.fillMaxWidth().padding(22.dp),
                        horizontalAlignment = Alignment.CenterHorizontally
                    ) {
                        Icon(Icons.Default.Article, null, tint = Green, modifier = Modifier.size(40.dp))
                        Spacer(Modifier.height(8.dp))
                        Text("News unavailable", fontWeight = FontWeight.ExtraBold, fontSize = 16.sp)
                        Spacer(Modifier.height(3.dp))
                        Text(
                            error ?: "The live news provider did not return articles for this category right now.",
                            color = Muted,
                            fontSize = 10.sp,
                            textAlign = TextAlign.Center
                        )
                    }
                }
            }
        } else {
            top?.let { featured ->
                item { Text("Top News", fontWeight = FontWeight.ExtraBold, fontSize = 18.sp, color = TextDark) }
                item { NewsFeatured(featured, open) }
            }

            if (trending.isNotEmpty()) {
                item {
                    Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                        Text("Most Trending News", Modifier.weight(1f), fontWeight = FontWeight.ExtraBold, fontSize = 18.sp, color = TextDark)
                        Text("View all →", color = Green, fontSize = 10.sp, fontWeight = FontWeight.Bold)
                    }
                }
                item {
                    LazyRow(
                        contentPadding = PaddingValues(horizontal = 1.dp),
                        horizontalArrangement = Arrangement.spacedBy(8.dp)
                    ) {
                        items(trending) { article -> NewsTrendingCard(article, open) }
                    }
                }
            }

            if (latest.isNotEmpty()) {
                item {
                    Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                        Text("Latest News", Modifier.weight(1f), fontWeight = FontWeight.ExtraBold, fontSize = 18.sp, color = TextDark)
                        Text("View all news →", color = Green, fontSize = 10.sp, fontWeight = FontWeight.Bold)
                    }
                }
                items(latest) { article -> NewsLatestCard(article, open) }
            }
        }

        item {
            Text(
                "News and corporate-action information is sourced through the MyStocks market-intelligence feed. Market data may be delayed; verify important announcements against the issuer or exchange source.",
                color = Muted,
                fontSize = 8.sp,
                modifier = Modifier.padding(horizontal = 3.dp)
            )
        }
    }
}

@Composable
private fun NewsTrendingCard(item:NewsItem, open:(NewsItem)->Unit){
    val meta = newsDisplayMeta(item)
    Card(
        Modifier.width(190.dp).height(178.dp).clickable { open(item) },
        RoundedCornerShape(15.dp),
        border = BorderStroke(1.dp, Border)
    ) {
        Column(Modifier.padding(10.dp)) {
            Row(verticalAlignment = Alignment.CenterVertically) {
                NewsMetaIcon(item, 38)
                Spacer(Modifier.width(7.dp))
                Text(
                    if (meta.company.isNotBlank()) meta.company else meta.label,
                    color = TextDark,
                    fontSize = 9.sp,
                    fontWeight = FontWeight.ExtraBold,
                    maxLines = 1,
                    modifier = Modifier.weight(1f)
                )
                if (meta.symbol.isNotBlank()) {
                    Surface(shape = RoundedCornerShape(20.dp), color = LightGreen) {
                        Text(meta.symbol, color = Green, fontSize = 7.sp, fontWeight = FontWeight.Bold, modifier = Modifier.padding(horizontal = 6.dp, vertical = 4.dp))
                    }
                }
            }
            Spacer(Modifier.height(8.dp))
            Text(item.title, color = Color(0xFF183B6B), fontWeight = FontWeight.Bold, fontSize = 12.sp, lineHeight = 15.sp, maxLines = 3)
            Spacer(Modifier.weight(1f))
            Row(verticalAlignment = Alignment.CenterVertically) {
                Icon(Icons.Default.CalendarMonth, null, tint = Muted, modifier = Modifier.size(14.dp))
                Spacer(Modifier.width(4.dp))
                Text(newsDate(item.publishedAt), color = Muted, fontSize = 8.sp)
            }
            Spacer(Modifier.height(5.dp))
            NewsChip("Trending", false)
        }
    }
}

@Composable
private fun NewsLatestCard(item:NewsItem, open:(NewsItem)->Unit){
    val meta = newsDisplayMeta(item)
    Card(
        Modifier.fillMaxWidth().clickable { open(item) },
        RoundedCornerShape(15.dp),
        border = BorderStroke(1.dp, Border)
    ) {
        Row(Modifier.padding(9.dp), verticalAlignment = Alignment.CenterVertically) {
            Surface(Modifier.size(80.dp, 70.dp), RoundedCornerShape(12.dp), LightGreen) {
                Box(Modifier.fillMaxSize(), Alignment.Center) {
                    if (item.imageUrl.isNotBlank()) {
                        AsyncImage(model=item.imageUrl, contentDescription=null, modifier=Modifier.fillMaxSize().clip(RoundedCornerShape(12.dp)), contentScale=androidx.compose.ui.layout.ContentScale.Crop)
                    } else {
                        NewsMetaIcon(item, 46)
                    }
                }
            }
            Spacer(Modifier.width(9.dp))
            Column(Modifier.weight(1f)) {
                Row(verticalAlignment = Alignment.CenterVertically) {
                    Text(
                        if (meta.company.isNotBlank()) meta.company else meta.label,
                        color = TextDark,
                        fontSize = 9.sp,
                        fontWeight = FontWeight.ExtraBold,
                        modifier = Modifier.weight(1f),
                        maxLines = 1
                    )
                    if (meta.symbol.isNotBlank()) {
                        Surface(shape=RoundedCornerShape(20.dp), color=LightGreen) {
                            Text(meta.symbol, color=Green, fontSize=7.sp, fontWeight=FontWeight.Bold, modifier=Modifier.padding(horizontal=6.dp, vertical=3.dp))
                        }
                    }
                }
                Spacer(Modifier.height(3.dp))
                Text(item.title, color=Color(0xFF183B6B), fontWeight=FontWeight.Bold, fontSize=11.sp, lineHeight=14.sp, maxLines=2)
                Spacer(Modifier.height(4.dp))
                Row(verticalAlignment=Alignment.CenterVertically) {
                    Icon(Icons.Default.CalendarMonth, null, tint=Muted, modifier=Modifier.size(13.dp))
                    Spacer(Modifier.width(4.dp))
                    Text(newsDate(item.publishedAt), color=Muted, fontSize=8.sp)
                    Spacer(Modifier.width(6.dp))
                    Text("|", color=Muted, fontSize=8.sp)
                    Spacer(Modifier.width(6.dp))
                    NewsChip(item.category, false)
                }
            }
            Spacer(Modifier.width(4.dp))
            Icon(Icons.Default.ChevronRight, null, tint=Muted, modifier=Modifier.size(22.dp))
        }
    }
}

'''
          s = s[:news_start] + news + s[news_end:]
          p.write_text(s)
          PY

      - name: Verify source
        run: |
          grep -q 'NewsTrendingCard' app/src/main/java/ke/co/nsewatcher/DesignActivity.kt
          grep -q 'NewsLatestCard' app/src/main/java/ke/co/nsewatcher/DesignActivity.kt
          grep -q 'padding(horizontal = 2.dp)' app/src/main/java/ke/co/nsewatcher/DesignActivity.kt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.14.4-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$GITHUB_WORKSPACE/gradle-8.14.4/bin" >> "$GITHUB_PATH"

      - name: Build project
        run: gradle --no-daemon build

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ke/co/nsewatcher/DesignActivity.kt
          git commit -m "ui: implement mobile News reference design"
          git push
          git rm .github/workflows/implement-news-design.yml
          git commit -m "chore: remove temporary News design workflow"
          git push
