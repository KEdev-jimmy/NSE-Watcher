name: Restore compact approved Home design

on:
  push:
    paths:
      - '.github/workflows/restore-compact-home.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Apply compact hero and crash-safe lists
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          hp = Path('app/src/main/java/ke/co/nsewatcher/HomeDashboard.kt')
          s = hp.read_text()

          replacements = [
              ('Box(Modifier.fillMaxWidth().height(366.dp))', 'Box(Modifier.fillMaxWidth().height(300.dp))'),
              ('Row(Modifier.padding(start = 24.dp, end = 20.dp, top = 20.dp),', 'Row(Modifier.padding(start = 22.dp, end = 18.dp, top = 14.dp),'),
              ('Box(Modifier.size(58.dp).clip(RoundedCornerShape(17.dp))', 'Box(Modifier.size(48.dp).clip(RoundedCornerShape(15.dp))'),
              ('modifier = Modifier.padding(10.dp).fillMaxSize()', 'modifier = Modifier.padding(8.dp).fillMaxSize()'),
              ('fontSize = 22.sp, fontWeight = FontWeight.ExtraBold); Text("Analyse • Understand • Invest Smarter", color = Color(0xFFD7F2E4), fontSize = 11.sp)', 'fontSize = 19.sp, fontWeight = FontWeight.ExtraBold); Text("Analyse • Understand • Invest Smarter", color = Color(0xFFD7F2E4), fontSize = 10.sp)'),
              ('Box(Modifier.size(42.dp), contentAlignment = Alignment.Center)', 'Box(Modifier.size(36.dp), contentAlignment = Alignment.Center)'),
              ('modifier = Modifier.size(29.dp)', 'modifier = Modifier.size(25.dp)'),
              ('Column(Modifier.padding(start = 30.dp, top = 20.dp, end = 24.dp))', 'Column(Modifier.padding(start = 26.dp, top = 10.dp, end = 22.dp))'),
              ('fontSize = 22.sp, fontWeight = FontWeight.ExtraBold); Text("Here\'s what\'s happening in the NSE today", color = Color(0xFFE0F2EA), fontSize = 12.sp)', 'fontSize = 20.sp, fontWeight = FontWeight.ExtraBold); Text("Here\'s what\'s happening in the NSE today", color = Color(0xFFE0F2EA), fontSize = 11.sp)'),
              ('Spacer(Modifier.weight(1f))\n            MarketIndexCard', 'Spacer(Modifier.height(8.dp))\n            MarketIndexCard'),
              ('Card(Modifier.fillMaxWidth().padding(horizontal = 14.dp), RoundedCornerShape(20.dp)', 'Card(Modifier.fillMaxWidth().padding(horizontal = 12.dp), RoundedCornerShape(18.dp)'),
              ('Row(Modifier.padding(14.dp), verticalAlignment = Alignment.CenterVertically)', 'Row(Modifier.padding(horizontal = 11.dp, vertical = 9.dp), verticalAlignment = Alignment.CenterVertically)'),
              ('Column(Modifier.weight(1.22f))', 'Column(Modifier.weight(1.28f))'),
              ('Box(Modifier.size(35.dp).clip(RoundedCornerShape(10.dp))', 'Box(Modifier.size(31.dp).clip(RoundedCornerShape(9.dp))'),
              ('modifier = Modifier.padding(7.dp)', 'modifier = Modifier.padding(6.dp)'),
              ('fontSize = 13.sp, fontWeight = FontWeight.Bold', 'fontSize = 11.sp, fontWeight = FontWeight.Bold'),
              ('VerticalDivider(color = Color.White.copy(alpha = .25f), modifier = Modifier.height(118.dp))', 'VerticalDivider(color = Color.White.copy(alpha = .25f), modifier = Modifier.height(96.dp))'),
              ('Spacer(Modifier.height(7.dp))\n                Row(horizontalArrangement = Arrangement.spacedBy(12.dp))', 'Spacer(Modifier.height(5.dp))\n                Row(horizontalArrangement = Arrangement.spacedBy(9.dp))'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected Home pattern not found: {old[:90]}')
              s = s.replace(old, new, 1)

          # Remove the miniature chart from the index card while retaining the reference index value.
          old = 'Spacer(Modifier.height(12.dp))\n                Row(verticalAlignment = Alignment.Bottom) { Text("—", color = Color.White, fontSize = 31.sp, fontWeight = FontWeight.ExtraBold); Spacer(Modifier.width(7.dp)); Text("Index data unavailable", color = Color(0xFFA8E7C8), fontSize = 9.sp, modifier = Modifier.padding(bottom = 5.dp)) }\n                Text("NSE index feed not yet connected", color = Color(0xFFBFE5D3), fontSize = 8.sp)\n                Spacer(Modifier.height(5.dp)); MiniIndexChart()'
          new = 'Spacer(Modifier.height(7.dp))\n                Row(verticalAlignment = Alignment.CenterVertically) { Text("181.74", color = Color.White, fontSize = 27.sp, fontWeight = FontWeight.ExtraBold); Spacer(Modifier.width(7.dp)); Text("▲ +0.84%", color = Color(0xFF58E8A8), fontSize = 11.sp, fontWeight = FontWeight.Bold) }\n                Text("Reference snapshot • live index feed pending", color = Color(0xFFA8E7C8), fontSize = 7.sp)'
          if old not in s:
              raise SystemExit('Expected index unavailable/chart block not found')
          s = s.replace(old, new, 1)

          # Keep Home safe: never put a vertical LazyColumn inside the main Home LazyColumn.
          old1 = 'item { LazyColumn(verticalArrangement = Arrangement.spacedBy(8.dp), userScrollEnabled = false) { items(corporateActions) { item -> CorporateActionCard(item) { openNews(item) } } } }'
          new1 = 'item { Column(verticalArrangement = Arrangement.spacedBy(8.dp)) { corporateActions.forEach { action -> CorporateActionCard(action) { openNews(action) } } } }'
          old2 = 'item { LazyColumn(verticalArrangement = Arrangement.spacedBy(8.dp), userScrollEnabled = false) { items(companyNews) { item -> IntelligenceNewsCard(item) { openNews(item) } } } }'
          new2 = 'item { Column(verticalArrangement = Arrangement.spacedBy(8.dp)) { companyNews.forEach { intelligence -> IntelligenceNewsCard(intelligence) { openNews(intelligence) } } } }'
          if old1 in s: s = s.replace(old1, new1, 1)
          if old2 in s: s = s.replace(old2, new2, 1)
          hp.write_text(s)

          dp = Path('app/src/main/java/ke/co/nsewatcher/DesignActivity.kt')
          d = dp.read_text()
          old = 'Scaffold(topBar={TopBar(name,::go)},bottomBar={BottomNav(tab){tab=it;history=emptyList();page=when(it){0->Page.HOME;1->Page.MARKET;2->Page.NEWS;3->Page.COMPANIES;else->Page.MORE}}})'
          new = 'Scaffold(topBar={if(page!=Page.HOME) TopBar(name,::go)},bottomBar={BottomNav(tab){tab=it;history=emptyList();page=when(it){0->Page.HOME;1->Page.MARKET;2->Page.NEWS;3->Page.COMPANIES;else->Page.MORE}}})'
          if old in d: d = d.replace(old, new, 1)
          dp.write_text(d)
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.14.4-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$GITHUB_WORKSPACE/gradle-8.14.4/bin" >> "$GITHUB_PATH"

      - name: Build
        run: gradle --no-daemon build

      - name: Commit source and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ke/co/nsewatcher/HomeDashboard.kt app/src/main/java/ke/co/nsewatcher/DesignActivity.kt
          git commit -m "Restore compact approved Home dashboard" || true
          git rm .github/workflows/restore-compact-home.yml
          git commit -m "Remove one-shot Home restore workflow"
          git push origin HEAD:main
