name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ""

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.14.4-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$GITHUB_WORKSPACE/gradle-8.14.4/bin" >> "$GITHUB_PATH"

      - name: Test signed publication safeguards
        run: python3 -m unittest scripts.test_publish_rolling_apks -v

      - name: Run backend quality tests
        run: node --test backend/test/companyIntelligence.test.js backend/test/marketStatus.test.js backend/test/company.test.js backend/test/movementIntelligence.test.js backend/test/newsRelevance.test.js backend/test/newsFeed.test.js backend/test/analyst.test.js

      - name: Build with Gradle
        run: gradle --no-daemon build

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NSE-Watcher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [build]
    if: needs.build.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    concurrency:
      group: nse-watcher-rolling-apk
      cancel-in-progress: false

    steps:
      - name: Checkout the commit that passed validation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ""

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install the existing Gradle version
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.14.4-bin.zip -o gradle.zip
          curl -fsSL https://services.gradle.org/distributions/gradle-8.14.4-bin.zip.sha256 -o gradle.zip.sha256
          printf '%s  gradle.zip\n' "$(cat gradle.zip.sha256)" | sha256sum --check
          unzip -q gradle.zip
          echo "$GITHUB_WORKSPACE/gradle-8.14.4/bin" >> "$GITHUB_PATH"

      - name: Require the permanent signing key and materialize its runner copy
        env:
          NSEWATCHER_RELEASE_KEYSTORE_BASE64: ${{ secrets.NSEWATCHER_RELEASE_KEYSTORE_BASE64 }}
          NSEWATCHER_RELEASE_STORE_PASSWORD: ${{ secrets.NSEWATCHER_RELEASE_STORE_PASSWORD }}
          NSEWATCHER_RELEASE_KEY_ALIAS: ${{ secrets.NSEWATCHER_RELEASE_KEY_ALIAS }}
          NSEWATCHER_RELEASE_KEY_PASSWORD: ${{ secrets.NSEWATCHER_RELEASE_KEY_PASSWORD }}
          NSEWATCHER_RELEASE_CERT_SHA256: ${{ vars.NSEWATCHER_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in NSEWATCHER_RELEASE_KEYSTORE_BASE64 NSEWATCHER_RELEASE_STORE_PASSWORD NSEWATCHER_RELEASE_KEY_ALIAS NSEWATCHER_RELEASE_KEY_PASSWORD NSEWATCHER_RELEASE_CERT_SHA256; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required signing input: $name. Publication stopped; no debug fallback."
              exit 1
            fi
          done
          umask 077
          keystore="$RUNNER_TEMP/nse-watcher-release.p12"
          printf '%s' "$NSEWATCHER_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          echo "NSEWATCHER_RELEASE_KEYSTORE=$keystore" >> "$GITHUB_ENV"
          echo "NSEWATCHER_VERSION_CODE=$((200000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "NSEWATCHER_VERSION_NAME=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build the signed release APK
        env:
          NSEWATCHER_RELEASE_STORE_PASSWORD: ${{ secrets.NSEWATCHER_RELEASE_STORE_PASSWORD }}
          NSEWATCHER_RELEASE_KEY_ALIAS: ${{ secrets.NSEWATCHER_RELEASE_KEY_ALIAS }}
          NSEWATCHER_RELEASE_KEY_PASSWORD: ${{ secrets.NSEWATCHER_RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify and publish exactly Full and Update APKs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK_PATH: app/build/outputs/apk/release/app-release.apk
          NSEWATCHER_RELEASE_CERT_SHA256: ${{ vars.NSEWATCHER_RELEASE_CERT_SHA256 }}
        run: python3 scripts/publish_rolling_apks.py

      - name: Remove the temporary runner keystore
        if: always()
        run: rm -f -- "$RUNNER_TEMP/nse-watcher-release.p12"
