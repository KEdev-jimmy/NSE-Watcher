name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  build:
    name: Build Android app
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.14.4
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.14.4-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$GITHUB_WORKSPACE/gradle-8.14.4/bin" >> "$GITHUB_PATH"

      - name: Verify current app structure
        run: |
          test -f app/src/main/java/ke/co/nsewatcher/DesignActivity.kt
          test ! -f app/src/main/java/ke/co/nsewatcher/ApprovedMarketActivity.kt
          test ! -f app/src/main/java/ke/co/nsewatcher/MainActivity.kt
          test ! -f app/src/main/java/ke/co/nsewatcher/UiBuildTrigger.kt
          grep -q 'private fun Home' app/src/main/java/ke/co/nsewatcher/DesignActivity.kt
          grep -q 'private fun Companies' app/src/main/java/ke/co/nsewatcher/DesignActivity.kt
          ! grep -R -q 'ApprovedMarketActivity' app/src/main/java || exit 1

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nse-watcher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
