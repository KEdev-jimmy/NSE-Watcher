name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  actions: write
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup completed workflow runs older than 3 days
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff_iso="$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          repo="$GITHUB_REPOSITORY"
          all_runs="$(mktemp)"
          old_ids="$(mktemp)"

          gh api --paginate "repos/$repo/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id, .created_at, .status] | @tsv' > "$all_runs"

          while IFS=$'\t' read -r run_id created_at status; do
            if [[ "$status" == "completed" && "$created_at" < "$cutoff_iso" ]]; then
              echo "$run_id" >> "$old_ids"
            fi
          done < "$all_runs"

          count="$(wc -l < "$old_ids" | tr -d ' ')"
          echo "Deleting $count completed workflow runs older than $cutoff_iso"

          if [[ "$count" -gt 0 ]]; then
            export GH_TOKEN repo
            xargs -r -n1 -P8 bash -c '
              id="$1"
              gh api --method DELETE "repos/$repo/actions/runs/$id" >/dev/null 2>&1 || true
            ' _ < "$old_ids"
          fi

          echo "Cleanup complete."

      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.14.4-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$GITHUB_WORKSPACE/gradle-8.14.4/bin" >> "$GITHUB_PATH"

      - name: Run backend quality tests
        run: node --test backend/test/companyIntelligence.test.js backend/test/marketStatus.test.js backend/test/company.test.js backend/test/movementIntelligence.test.js backend/test/newsRelevance.test.js backend/test/newsFeed.test.js backend/test/analyst.test.js

      - name: Build with Gradle
        run: gradle --no-daemon build

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NSE-Watcher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
