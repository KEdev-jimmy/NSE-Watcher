name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.14.4-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$GITHUB_WORKSPACE/gradle-8.14.4/bin" >> "$GITHUB_PATH"

      - name: Repair Android source compile error
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/src/main/java/ke/co/nsewatcher/CompanyIntelligence.kt")
          text = path.read_text()
          fixed = text.replace("lineHeight = 14.dp", "lineHeight = 14.sp")
          if fixed != text:
              path.write_text(fixed)
          PY
          if ! git diff --quiet -- app/src/main/java/ke/co/nsewatcher/CompanyIntelligence.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/ke/co/nsewatcher/CompanyIntelligence.kt
            git commit -m "Fix Company Intelligence Android compile error [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build with Gradle
        run: gradle --no-daemon build

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NSE-Watcher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
