name: Fix current UI compile

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-current-ui-build.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix malformed multiline UI strings
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/src/main/java/ke/co/nsewatcher/DesignActivity.kt')
          text = path.read_text()
          replacements = {
              'Text("“Small steps in learning\nlead to big results in investing.”"': 'Text("“Small steps in learning\\nlead to big results in investing.”"',
              'Text("Research. Analyze. Invest.\nFind the right companies for your future."': 'Text("Research. Analyze. Invest.\\nFind the right companies for your future."',
          }
          changed = False
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
                  changed = True
          if not changed:
              print('No malformed multiline strings found.')
          else:
              path.write_text(text)
              print('Fixed malformed multiline strings.')
      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ke/co/nsewatcher/DesignActivity.kt
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Fix Home and Companies UI compile strings [skip ci]'
          git push
