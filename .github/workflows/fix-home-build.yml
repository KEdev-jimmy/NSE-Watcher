name: Fix Home dashboard build

on:
  push:
    paths:
      - '.github/workflows/fix-home-build.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fix invalid Kotlin function name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/ke/co/nsewatcher/HomeDashboard.kt')
          s = p.read_text()
          s2 = s.replace("fun Today'sIntelligence(", "fun TodaysIntelligence(")
          if s2 == s:
              print('No invalid function declaration found; source may already be fixed.')
          else:
              p.write_text(s2)
              print('Fixed Today\'sIntelligence -> TodaysIntelligence')
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.14.4-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$GITHUB_WORKSPACE/gradle-8.14.4/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ke/co/nsewatcher/HomeDashboard.kt
          git commit -m "Fix Home intelligence function name" || true
          git rm .github/workflows/fix-home-build.yml
          git commit -m "Remove temporary Home build fix workflow"
          git push origin HEAD:main
