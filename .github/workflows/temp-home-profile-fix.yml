name: Temporary Home Profile UI Patch

on:
  push:
    branches: [home-profile-ui-fix]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply targeted UI patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/java/ke/co/nsewatcher/DesignActivity.kt")
          text = path.read_text()

          old_top = '@Composable private fun TopBar(name:String,go:(Page)->Unit){Row(Modifier.fillMaxWidth().padding(horizontal=15.dp,vertical=8.dp),verticalAlignment=Alignment.CenterVertically){Surface(Modifier.size(42.dp),RoundedCornerShape(12.dp),LightGreen){Icon(Icons.Default.ShowChart,null,Modifier.padding(7.dp),Green)};Spacer(Modifier.width(9.dp));Column(Modifier.weight(1f)){Text("NSE Watcher",fontSize=18.sp,fontWeight=FontWeight.ExtraBold);Text("Analyse • Understand • Invest Smarter",fontSize=10.sp,color=Muted)};IconButton({}){Icon(Icons.Default.Search,"Search",tint=Green)};Avatar(name){go(Page.PROFILE)};IconButton({go(Page.SETTINGS)}){Icon(Icons.Default.Settings,"Settings",tint=Green)}}}'
          new_top = '@Composable private fun TopBar(name:String,go:(Page)->Unit){Row(Modifier.fillMaxWidth().padding(horizontal=15.dp,vertical=8.dp),verticalAlignment=Alignment.CenterVertically){Surface(Modifier.size(42.dp),RoundedCornerShape(12.dp),LightGreen){Icon(Icons.Default.ShowChart,null,Modifier.padding(7.dp),Green)};Spacer(Modifier.width(9.dp));Column(Modifier.weight(1f)){Text("NSE Watcher",fontSize=18.sp,fontWeight=FontWeight.ExtraBold);Text("Analyse • Understand • Invest Smarter",fontSize=10.sp,color=Muted)};Avatar(name){go(Page.PROFILE)}}}'

          old_portfolio = '''        item{
            Card(Modifier.fillMaxWidth(),RoundedCornerShape(17.dp),colors=CardDefaults.cardColors(containerColor=Color.White),border=BorderStroke(1.dp,Border)){
                Column(Modifier.padding(16.dp)){
                    Text("Portfolio Value (Paper Invest)",color=DarkGreen,fontSize=11.sp)
                    Text(String.format(Locale.US,"KSh %,d",portfolioValue),fontSize=25.sp,fontWeight=FontWeight.ExtraBold,color=TextDark)
                    Text("▲ 12.4%",color=Green,fontSize=12.sp,fontWeight=FontWeight.ExtraBold)
                    Row(Modifier.fillMaxWidth(),horizontalArrangement=Arrangement.End){Text("vs. last 30 days",color=Muted,fontSize=9.sp)}
                }
            }
        }'''
          new_portfolio = old_portfolio.replace('Column(Modifier.padding(16.dp))', 'Column(Modifier.padding(12.dp))')

          old_totals = '''                Card(Modifier.weight(1f),RoundedCornerShape(15.dp),colors=CardDefaults.cardColors(containerColor=Color.White),border=BorderStroke(1.dp,Border)){
                    Column(Modifier.padding(13.dp)){Text("Total Invested",color=Muted,fontSize=10.sp);Text(String.format(Locale.US,"KSh %,d",totalInvested),fontWeight=FontWeight.ExtraBold,fontSize=16.sp,color=TextDark)}
                }
                Card(Modifier.weight(1f),RoundedCornerShape(15.dp),colors=CardDefaults.cardColors(containerColor=Color.White),border=BorderStroke(1.dp,Border)){
                    Column(Modifier.padding(13.dp)){Text("Total Return",color=Muted,fontSize=10.sp);Text(String.format(Locale.US,"KSh %,d",totalReturn),fontWeight=FontWeight.ExtraBold,fontSize=16.sp,color=TextDark);Text("▲ 36.4%",color=Green,fontSize=10.sp,fontWeight=FontWeight.Bold)}
                }'''
          new_totals = old_totals.replace('Column(Modifier.padding(13.dp))', 'Column(Modifier.padding(10.dp))')

          old_profile = '''item{RowItem(Icons.Default.PhotoCamera,"Profile Picture","Change your profile photo",pick)};item{RowItem(Icons.Default.Lock,"Account Security","Password and device protection"){go(Page.SECURITY)}};item{RowItem(Icons.Default.PrivacyTip,"Privacy","Review your privacy settings"){go(Page.PRIVACY)}};item{Note("NSE Watcher provides market information and analysis. It does not execute trades or guarantee returns.")}}}'''
          new_profile = '''item{RowItem(Icons.Default.PhotoCamera,"Profile Picture","Change your profile photo",pick)};item{RowItem(Icons.Default.Settings,"Settings","Customize your NSE Watcher experience"){go(Page.SETTINGS)}};item{RowItem(Icons.Default.Lock,"Account Security","Password and device protection"){go(Page.SECURITY)}};item{RowItem(Icons.Default.PrivacyTip,"Privacy","Review your privacy settings"){go(Page.PRIVACY)}};item{Note("NSE Watcher provides market information and analysis. It does not execute trades or guarantee returns.")}}}'''

          replacements = [
              (old_top, new_top, "TopBar"),
              (old_portfolio, new_portfolio, "Portfolio card"),
              (old_totals, new_totals, "Total cards"),
              (old_profile, new_profile, "Profile settings row"),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}; no write performed")
              text = text.replace(old, new)

          path.write_text(text)

      - name: Verify only requested source file changed
        run: |
          git status --short
          test "$(git status --short | wc -l)" -eq 1
          test "$(git status --short | awk '{print $2}')" = "app/src/main/java/ke/co/nsewatcher/DesignActivity.kt"

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-home-profile-fix.yml
          git add app/src/main/java/ke/co/nsewatcher/DesignActivity.kt
          git commit -m "feat: refine Home and Profile settings UI"
          git push origin HEAD:home-profile-ui-fix
