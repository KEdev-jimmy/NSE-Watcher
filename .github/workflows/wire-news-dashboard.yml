name: Wire News dashboard
on:
  push:
    paths:
      - '.github/workflows/wire-news-dashboard.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire News and Home spacing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/ke/co/nsewatcher/DesignActivity.kt')
          s=p.read_text()
          old='Page.NEWS->News{selectedNews=it;go(Page.NEWS_DETAIL)}'
          new='Page.NEWS->NewsDashboard{selectedNews=it;go(Page.NEWS_DETAIL)}'
          if old not in s: raise SystemExit('News route not found')
          s=s.replace(old,new,1)
          old='            MarketIndexCard(advancing, declining, unchanged, reportedVolume)'
          new='            Box(Modifier.fillMaxWidth().padding(horizontal = 2.dp)) {\n                MarketIndexCard(advancing, declining, unchanged, reportedVolume)\n            }'
          if old not in s: raise SystemExit('Home index card not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install SDK
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.14.4-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$GITHUB_WORKSPACE/gradle-8.14.4/bin" >> "$GITHUB_PATH"
      - name: Build
        run: gradle --no-daemon build
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ke/co/nsewatcher/DesignActivity.kt
          git commit -m "ui: wire mobile News dashboard and index spacing"
          git push
          git rm .github/workflows/wire-news-dashboard.yml
          git commit -m "chore: remove temporary News wiring workflow"
          git push
