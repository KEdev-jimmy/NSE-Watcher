name: Finish Company Intelligence

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.14.4-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$GITHUB_WORKSPACE/gradle-8.14.4/bin" >> "$GITHUB_PATH"
      - name: Wire deterministic intelligence engine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/ke/co/nsewatcher/CompanyIntelligence.kt')
          text = path.read_text()
          if 'import ke.co.nsewatcher.data.CompanyIntelligenceEngine' not in text:
              text = text.replace('import ke.co.nsewatcher.data.CompanyIntelligenceCache\n', 'import ke.co.nsewatcher.data.CompanyIntelligenceCache\nimport ke.co.nsewatcher.data.CompanyIntelligenceEngine\n')
          anchor = '    val monthlyReturn = percentReturn(monthHistory)\n'
          if 'val intelligenceView = CompanyIntelligenceEngine.build' not in text:
              text = text.replace(anchor, anchor + '    val intelligenceView = CompanyIntelligenceEngine.build(s, intelligence, monthHistory, news)\n')
          text = text.replace('Text(intelligenceLine, color = Color.White, fontSize = 11.sp, lineHeight = 17.sp)', 'Text(intelligenceView.summary, color = Color.White, fontSize = 11.sp, lineHeight = 17.sp)')
          start = text.find('        item { SectionTitle("Intelligence signals",')
          end = text.find('item { SectionTitle("Bull / Bear / Unknown",', start)
          if start >= 0 and end > start:
              block = '''        item { SectionTitle("Intelligence signals", "Deterministic evidence signals — no invented conclusions", Icons.Default.Insights) }\n        item {\n            IntelligenceCard {\n                Text(intelligenceView.confidence, color = IntelligenceGreen, fontSize = 9.sp, fontWeight = FontWeight.ExtraBold)\n                Spacer(Modifier.height(6.dp))\n                Text("Coverage: ${intelligenceView.quality.state} • ${intelligenceView.quality.availableCount}/5 evidence areas", color = IntelligenceMuted, fontSize = 9.sp)\n                Spacer(Modifier.height(10.dp))\n                SignalGroup("SUPPORTING", IntelligenceGreen, intelligenceView.signals.filter { it.type == CompanyIntelligenceEngine.SignalType.SUPPORTING }.map { it.text })\n                SignalGroup("CAUTION", IntelligenceRed, intelligenceView.signals.filter { it.type == CompanyIntelligenceEngine.SignalType.CAUTION }.map { it.text })\n                SignalGroup("UNKNOWN / NEEDS EVIDENCE", IntelligenceMuted, intelligenceView.unknowns)\n            }\n        }\n\n'''
              text = text[:start] + block + text[end:]
          start = text.find('        item { SectionTitle("Risks to investigate",')
          end = text.find('        item { SectionTitle("Intelligence signals",', start)
          if start >= 0 and end > start:
              block = '''        item { SectionTitle("Risks to investigate", "Questions raised by the available evidence", Icons.Default.Warning) }\n        item {\n            IntelligenceCard {\n                if (intelligenceView.risks.isEmpty()) {\n                    Text("No automatic watchpoint was generated from the currently available evidence. This does not mean the company has no risks.", color = IntelligenceMuted, fontSize = 10.sp)\n                } else {\n                    intelligenceView.risks.forEach { Watchpoint(it) }\n                }\n            }\n        }\n\n'''
              text = text[:start] + block + text[end:]
          marker = '        item { SectionTitle("Evidence", "Where the important information came from", Icons.Default.Verified) }'
          if 'intelligenceView.quality.evidenceCount' not in text:
              quality = '''        item {\n            IntelligenceCard {\n                EvidenceRow("Coverage", "${intelligenceView.quality.state} • ${intelligenceView.quality.availableCount}/5 areas")\n                EvidenceRow("Evidence", "${intelligenceView.quality.evidenceCount} sourced claims returned")\n                EvidenceRow("Confidence", intelligenceView.confidence)\n            }\n        }\n\n'''
              text = text.replace(marker, quality + marker)
          path.write_text(text)
          PY
      - name: Strengthen company backend with merged news evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/api/company.js')
          text = path.read_text()
          old = '''    const [profileResponse, dividendResponse] = await Promise.allSettled([\n      mystocks(`/companies/${encodeURIComponent(symbol)}`),\n      mystocks(`/dividends/${encodeURIComponent(symbol)}/history?limit=12`),\n    ]);'''
          new = '''    const [profileResponse, dividendResponse, newsResponse] = await Promise.allSettled([\n      mystocks(`/companies/${encodeURIComponent(symbol)}`),\n      mystocks(`/dividends/${encodeURIComponent(symbol)}/history?limit=12`),\n      mystocks(`/companies/${encodeURIComponent(symbol)}/news?limit=10`),\n    ]);'''
          if old in text: text = text.replace(old, new)
          old = '''    const dividends = dividendResponse.status === 'fulfilled'\n      ? (dividendResponse.value.history || dividendResponse.value.data || [])\n      : [];\n    const fetchedAt = new Date().toISOString();'''
          new = '''    const dividends = dividendResponse.status === 'fulfilled'\n      ? (dividendResponse.value.history || dividendResponse.value.data || [])\n      : [];\n    const news = newsResponse.status === 'fulfilled'\n      ? (newsResponse.value.items || newsResponse.value.news || newsResponse.value.data || [])\n      : [];\n    const fetchedAt = new Date().toISOString();'''
          if old in text: text = text.replace(old, new)
          old = '''    const evidence = buildEvidence(profile || {}, Array.isArray(dividends) ? dividends : [], financialHistory, fetchedAt, symbol);'''
          new = '''    const evidence = buildEvidence(profile || {}, Array.isArray(dividends) ? dividends : [], financialHistory, fetchedAt, symbol);\n    news.slice(0, 10).forEach((item, index) => {\n      const title = pick(item, ['title', 'headline', 'name']);\n      const publishedAt = pick(item, ['publishedAt', 'published', 'date', 'createdAt']);\n      if (title) evidence.push({ claim: `Company intelligence item ${index + 1}`, value: [title, publishedAt].filter(Boolean).join(' • '), source: 'MyStocks Africa', endpoint: `/companies/${symbol}/news`, symbol, fetchedAt });\n    });'''
          if old in text: text = text.replace(old, new)
          old = '''      financialHistory,\n      evidence,\n      dataQuality: {\n        profileAvailable: Boolean(profile),\n        dividendHistoryAvailable: Array.isArray(dividends) && dividends.length > 0,\n        financialHistoryAvailable: financialHistory.length > 0,\n        evidenceCount: evidence.length,\n      },\n      partial: !profile || dividendResponse.status !== 'fulfilled','''
          new = '''      financialHistory,\n      news,\n      evidence,\n      dataQuality: {\n        profileAvailable: Boolean(profile),\n        dividendHistoryAvailable: Array.isArray(dividends) && dividends.length > 0,\n        financialHistoryAvailable: financialHistory.length > 0,\n        newsAvailable: Array.isArray(news) && news.length > 0,\n        evidenceCount: evidence.length,\n      },\n      providerStatus: { profile: profileResponse.status, dividends: dividendResponse.status, news: newsResponse.status },\n      partial: !profile || dividendResponse.status !== 'fulfilled' || newsResponse.status !== 'fulfilled','''
          if old in text: text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Build Android app
        run: gradle --no-daemon build
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/finish-company-intelligence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ke/co/nsewatcher/CompanyIntelligence.kt backend/api/company.js .github/workflows/finish-company-intelligence.yml
          git commit -m "feat: connect company intelligence engine and evidence pipeline"
          git push
