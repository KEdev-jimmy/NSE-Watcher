name: Wire MyStocks UI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "scripts/wire_mystocks_ui.py"
      - ".github/workflows/wire-mystocks-ui.yml"

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply MyStocks UI wiring
        run: python3 scripts/wire_mystocks_ui.py

      - name: Commit UI wiring
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ke/co/nsewatcher/DesignActivity.kt
          if git diff --cached --quiet; then
            echo "UI wiring is already applied."
            exit 0
          fi
          git commit -m "feat: connect dashboard to MyStocks cache"
          git push
