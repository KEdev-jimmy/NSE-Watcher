name: One-time source repair

on:
  push:
    branches: [ "main" ]
    paths:
      - "app/src/main/java/ke/co/nsewatcher/DesignActivity.kt"
      - ".github/workflows/repair-design-source.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair malformed Kotlin string
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/ke/co/nsewatcher/DesignActivity.kt")
          s = p.read_text(encoding="utf-8")
          bad = 'Text("Research. Analyze. Invest.\nFind the right companies for your future.",color=Color.White,fontSize=11.sp)'
          good = 'Text("Research. Analyze. Invest.\\nFind the right companies for your future.",color=Color.White,fontSize=11.sp)'
          if bad not in s:
              print("No malformed Companies string found; nothing to repair.")
              raise SystemExit(0)
          p.write_text(s.replace(bad, good), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ke/co/nsewatcher/DesignActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m "fix: repair malformed Companies UI string"
          git push
