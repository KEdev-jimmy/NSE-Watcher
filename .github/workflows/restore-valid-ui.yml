name: Restore Valid UI Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore last known valid UI source
        run: |
          set -e
          TARGET='app/src/main/java/ke/co/nsewatcher/DesignActivity.kt'
          git show 5c462d605b69247fb35a29e0a975e9b5cdd7e3fb:"$TARGET" > "$TARGET"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/ke/co/nsewatcher/DesignActivity.kt')
          text = p.read_text()
          start = text.find('                  item{Column{Row(verticalAlignment=Alignment.CenterVertically){Text("Quick Actions"')
          if start >= 0:
              end = text.find('                  item{Card(Modifier.fillMaxWidth(),RoundedCornerShape(15.dp)', start)
              if end >= 0:
                  text = text[:start] + text[end:]
          p.write_text(text)
          PY
          grep -q 'private fun Home' "$TARGET"
          grep -q 'private fun Companies' "$TARGET"

      - name: Commit restored source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ke/co/nsewatcher/DesignActivity.kt
          if git diff --cached --quiet; then
            echo 'Source is already restored.'
            exit 0
          fi
          git commit -m 'Restore valid Home and Companies UI source'
          git push
