name: Wire News dashboard v3
on:
  push:
    paths:
      - '.github/workflows/wire-news-v3.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/ke/co/nsewatcher/DesignActivity.kt')
          s=p.read_text()
          old='Page.NEWS->News{selectedNews=it;go(Page.NEWS_DETAIL)}'
          if old not in s: raise SystemExit('News route not found')
          p.write_text(s.replace(old,'Page.NEWS->NewsDashboard{selectedNews=it;go(Page.NEWS_DETAIL)}',1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ke/co/nsewatcher/DesignActivity.kt
          git commit -m "ui: wire mobile News dashboard"
          git push
          git rm .github/workflows/wire-news-v3.yml
          git commit -m "chore: remove temporary News route workflow"
          git push
