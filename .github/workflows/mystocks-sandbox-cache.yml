name: MyStocks Sandbox Market Cache

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  refresh-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch NSE market data from MyStocks sandbox
        env:
          MYSTOCKS_API_KEY: ${{ secrets.nse_secret }}
        run: |
          set -euo pipefail
          test -n "$MYSTOCKS_API_KEY"
          mkdir -p data/mystocks
          curl --fail-with-body --silent --show-error \
            "https://mystocks.africa/api/sandbox/v1/partner/market/status" \
            -H "Authorization: Bearer $MYSTOCKS_API_KEY" \
            -H "Accept: application/json" \
            -o data/mystocks/market-status.json
          curl --fail-with-body --silent --show-error \
            "https://mystocks.africa/api/sandbox/v1/partner/stocks?exchange=NSE&limit=50" \
            -H "Authorization: Bearer $MYSTOCKS_API_KEY" \
            -H "Accept: application/json" \
            -o data/mystocks/stocks.json
          printf '%s\n' "{\"provider\":\"MyStocks Africa\",\"environment\":\"sandbox\",\"exchange\":\"NSE\",\"retrievedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > data/mystocks/metadata.json

      - name: Publish cache
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mystocks
          if git diff --cached --quiet; then
            echo "No market-data changes to publish."
            exit 0
          fi
          git commit -m "chore: refresh MyStocks NSE sandbox cache"
          git push
