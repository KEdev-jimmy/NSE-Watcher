name: Refine Home layout

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refine-home-layout.yml'

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply requested Home layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/ke/co/nsewatcher/HomeDashboard.kt')
          s = p.read_text()

          old = '''        item {\n            HomeHero(\n                advancing = advancing,\n                declining = declining,\n                unchanged = unchanged,\n                reportedVolume = reportedVolume\n            )\n        }'''
          new = '''        item {\n            HomeHero(\n                advancing = advancing,\n                declining = declining,\n                unchanged = unchanged,\n                reportedVolume = reportedVolume\n            )\n        }'''
          if old not in s:
              raise SystemExit('HomeDashboard: HomeHero call block not found')

          # Make the hero a compact background area while allowing the index card to overlap its bottom edge.
          old_hero_start = '''private fun HomeHero(advancing: Int, declining: Int, unchanged: Int, reportedVolume: Long) {\n    Box(Modifier.fillMaxWidth().height(286.dp)) {\n        AsyncImage('''
          new_hero_start = '''private fun HomeHero(advancing: Int, declining: Int, unchanged: Int, reportedVolume: Long) {\n    Box(Modifier.fillMaxWidth().height(305.dp)) {\n        Box(Modifier.fillMaxWidth().height(235.dp)) {\n            AsyncImage('''
          if old_hero_start not in s:
              raise SystemExit('HomeDashboard: hero start not found')
          s = s.replace(old_hero_start, new_hero_start, 1)

          old_hero_end = '''        Box(Modifier.fillMaxSize().background(Color(0x66002018)))\n\n        Column(Modifier.fillMaxSize()) {'''
          new_hero_end = '''            Box(Modifier.fillMaxSize().background(Color(0x66002018)))\n        }\n\n        Column(Modifier.fillMaxWidth()) {'''
          if old_hero_end not in s:
              raise SystemExit('HomeDashboard: hero background close block not found')
          s = s.replace(old_hero_end, new_hero_end, 1)

          old_header = '''            Row(\n                Modifier.padding(start = 24.dp, end = 20.dp, top = 20.dp),'''
          new_header = '''            Row(\n                Modifier.padding(start = 24.dp, end = 20.dp, top = 16.dp),'''
          s = s.replace(old_header, new_header, 1)

          old_logo = '''                Box(Modifier.size(58.dp).clip(RoundedCornerShape(17.dp)).background(HomeGreen)) {\n                    Icon(Icons.Default.ShowChart, null, tint = Color.White, modifier = Modifier.padding(10.dp).fillMaxSize())\n                }'''
          new_logo = '''                Box(Modifier.size(52.dp).clip(RoundedCornerShape(16.dp)).background(HomeGreen)) {\n                    Icon(Icons.Default.ShowChart, null, tint = Color.White, modifier = Modifier.padding(9.dp).fillMaxSize())\n                }'''
          if old_logo not in s:
              raise SystemExit('HomeDashboard: hero logo block not found')
          s = s.replace(old_logo, new_logo, 1)

          old_greeting = '''            Column(Modifier.padding(start = 30.dp, top = 20.dp, end = 24.dp)) {'''
          new_greeting = '''            Column(Modifier.padding(start = 30.dp, top = 13.dp, end = 24.dp)) {'''
          if old_greeting not in s:
              raise SystemExit('HomeDashboard: greeting block not found')
          s = s.replace(old_greeting, new_greeting, 1)

          old_card = '''            Spacer(Modifier.height(10.dp))\n            MarketIndexCard(advancing, declining, unchanged, reportedVolume)'''
          new_card = '''            Spacer(Modifier.height(7.dp))\n            Box(Modifier.fillMaxWidth().padding(horizontal = 14.dp)) {\n                MarketIndexCard(advancing, declining, unchanged, reportedVolume)\n            }'''
          if old_card not in s:
              raise SystemExit('HomeDashboard: index card placement not found')
          s = s.replace(old_card, new_card, 1)

          # Compact index card and keep it visually floating over the hero/background boundary.
          old_index = '''        Row(Modifier.padding(11.dp), verticalAlignment = Alignment.CenterVertically) {'''
          new_index = '''        Row(Modifier.padding(horizontal = 10.dp, vertical = 8.dp), verticalAlignment = Alignment.CenterVertically) {'''
          if old_index not in s:
              raise SystemExit('HomeDashboard: index row not found')
          s = s.replace(old_index, new_index, 1)

          s = s.replace('''                    Box(Modifier.size(30.dp).clip(RoundedCornerShape(9.dp)).background(Color(0xFF0B7652))) {''', '''                    Box(Modifier.size(27.dp).clip(RoundedCornerShape(8.dp)).background(Color(0xFF0B7652))) {''', 1)
          s = s.replace('''                    Spacer(Modifier.width(8.dp))\n                    Text("NSE All Share Index",''', '''                    Spacer(Modifier.width(7.dp))\n                    Text("NSE All Share Index",''', 1)
          s = s.replace('''                Spacer(Modifier.height(7.dp))\n                Row(verticalAlignment = Alignment.Bottom) {\n          Text("181.74", color = Color.White, fontSize = 25.sp,''', '''                Spacer(Modifier.height(4.dp))\n                Row(verticalAlignment = Alignment.Bottom) {\n          Text("181.74", color = Color.White, fontSize = 23.sp,''', 1)
          s = s.replace('''            VerticalDivider(color = Color.White.copy(alpha = .25f), modifier = Modifier.height(91.dp))''', '''            VerticalDivider(color = Color.White.copy(alpha = .25f), modifier = Modifier.height(78.dp))''', 1)
          s = s.replace('''                Spacer(Modifier.height(7.dp))\n                HorizontalDivider(color = Color.White.copy(alpha = .22f))\n                Spacer(Modifier.height(7.dp))''', '''                Spacer(Modifier.height(5.dp))\n                HorizontalDivider(color = Color.White.copy(alpha = .22f))\n                Spacer(Modifier.height(5.dp))''', 1)

          # Four Market Movers should fit in one row on a normal phone width.
          s = s.replace('''contentPadding = PaddingValues(horizontal = 14.dp),\n                    horizontalArrangement = Arrangement.spacedBy(8.dp)\n                ) {\n                    items(gainers.take(4)) { stock -> MoverCard(stock) { openCompany(stock) } }''', '''contentPadding = PaddingValues(horizontal = 14.dp),\n                    horizontalArrangement = Arrangement.spacedBy(7.dp)\n                ) {\n                    items(gainers.take(4)) { stock -> MoverCard(stock) { openCompany(stock) } }''', 1)
          s = s.replace('''Card(Modifier.width(151.dp).clickable(onClick = onClick),''', '''Card(Modifier.width(88.dp).clickable(onClick = onClick),''', 1)
          s = s.replace('''            HomeLogo(stock.symbol, stock.logoUrl, 35)''', '''            HomeLogo(stock.symbol, stock.logoUrl, 29)''', 1)
          s = s.replace('''            Text(stock.symbol, color = HomeMuted, fontSize = 9.sp)''', '''            Text(stock.symbol, color = HomeMuted, fontSize = 8.sp)''', 1)
          s = s.replace('''            Text(String.format(Locale.US, "KSh %.2f", stock.price), color = HomeTextDark, fontSize = 13.sp,''', '''            Text(String.format(Locale.US, "KSh %.2f", stock.price), color = HomeTextDark, fontSize = 11.sp,''', 1)
          s = s.replace('''            Text("▲ ${String.format(Locale.US, "%.2f%%", stock.change)}", color = HomeGreen, fontSize = 10.sp,''', '''            Text("▲ ${String.format(Locale.US, "%.2f%%", stock.change)}", color = HomeGreen, fontSize = 9.sp,''', 1)
          s = s.replace('''Column(Modifier.padding(10.dp)) {''', '''Column(Modifier.padding(8.dp)) {''', 1)

          # Sector Pulse already has sector-specific icons; make them consistently visible and compact.
          s = s.replace('''Box(Modifier.size(31.dp).clip(RoundedCornerShape(9.dp)).background(iconBg)) { Icon(icon, null, tint = HomeDarkGreen, modifier = Modifier.padding(6.dp)) }''', '''Box(Modifier.size(28.dp).clip(RoundedCornerShape(8.dp)).background(iconBg)) { Icon(icon, null, tint = HomeDarkGreen, modifier = Modifier.padding(5.dp)) }''', 1)

          p.write_text(s)
          PY

      - name: Verify requested changes
        run: |
          grep -q 'height(305.dp)' app/src/main/java/ke/co/nsewatcher/HomeDashboard.kt
          grep -q 'height(235.dp)' app/src/main/java/ke/co/nsewatcher/HomeDashboard.kt
          grep -q 'width(88.dp)' app/src/main/java/ke/co/nsewatcher/HomeDashboard.kt
          grep -q 'items(gainers.take(4))' app/src/main/java/ke/co/nsewatcher/HomeDashboard.kt
          grep -q '"banking", "banks" -> Icons.Default.AccountBalance' app/src/main/java/ke/co/nsewatcher/HomeDashboard.kt
          if grep -q 'fillMaxWidth().height(286.dp)' app/src/main/java/ke/co/nsewatcher/HomeDashboard.kt; then exit 1; fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.14.4-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$GITHUB_WORKSPACE/gradle-8.14.4/bin" >> "$GITHUB_PATH"

      - name: Build project
        run: gradle --no-daemon build

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ke/co/nsewatcher/HomeDashboard.kt
          git commit -m "ui: compact floating Home hero and fit market movers" || true
          git push
          git rm .github/workflows/refine-home-layout.yml
          git commit -m "chore: remove temporary Home layout workflow"
          git push
