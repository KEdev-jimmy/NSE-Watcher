name: Temporary Company Intelligence UI edit
on:
  push:
    branches: [ "main" ]
permissions:
  contents: write
jobs:
  edit:
    if: github.event.head_commit.message != 'Update Company Intelligence period clarity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused UI changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/ke/co/nsewatcher/CompanyIntelligence.kt')
          s = p.read_text()
          replacements = {
              'var period by rememberSaveable(s.symbol) { mutableStateOf("1Y") }': 'var period by rememberSaveable(s.symbol) { mutableStateOf("1D") }',
              'val monthlyReturn = percentReturn(monthHistory)\n    val intelligenceView': 'val monthlyReturn = percentReturn(monthHistory)\n    val selectedPeriodReturn = percentReturn(history)\n    val latestFinancialPeriod = intelligence.financialHistory.lastOrNull()?.period.orEmpty()\n    val intelligenceView',
              'item { SectionTitle("Financial health", "Latest company financial evidence", Icons.Default.Assessment) }': 'item { SectionTitle("Financial health", "Latest reported annual financial evidence", Icons.Default.Assessment) }',
              '            IntelligenceCard {\n                MetricGrid(listOf(\n                    "Revenue" to formatFinancialValue(profile.revenue),': '            IntelligenceCard {\n                Text(\n                    financialPeriodLabel(latestFinancialPeriod),\n                    color = IntelligenceMuted,\n                    fontSize = 9.sp,\n                    fontWeight = FontWeight.SemiBold\n                )\n                Spacer(Modifier.height(8.dp))\n                MetricGrid(listOf(\n                    "Revenue" to formatFinancialValue(profile.revenue),',
              'item { SectionTitle("Growth", "Latest reported growth signals", Icons.Default.TrendingUp) }': 'item { SectionTitle("Growth", "Year-over-year change in the latest reported figures", Icons.Default.TrendingUp) }',
              '                    "EPS" to valueOrMissing(profile.eps)\n                ))\n                Spacer(Modifier.height(8.dp))\n                Text("Historical financial trend will only be shown when the source provides a comparable series; no figures are invented here."': '                    "EPS (latest)" to valueOrMissing(profile.eps)\n                ))\n                Spacer(Modifier.height(8.dp))\n                Text("Growth compares the latest reported annual figures with the previous comparable annual period."',
          }
          for a,b in replacements.items():
              if a not in s:
                  raise SystemExit(f'Missing expected source text: {a[:100]}')
              s = s.replace(a,b,1)

          old = '''                    Text(\n                        String.format(Locale.US, "%+.2f%% today", s.change),\n                        color = if (s.change >= 0) IntelligenceGreen else IntelligenceRed,\n                        fontWeight = FontWeight.ExtraBold,\n                        fontSize = 13.sp\n                    )'''
          new = '''                    selectedPeriodReturn?.let { periodReturn ->\n                        Text(\n                            formatPeriodReturn(period, periodReturn),\n                            color = if (periodReturn >= 0) IntelligenceGreen else IntelligenceRed,\n                            fontWeight = FontWeight.ExtraBold,\n                            fontSize = 13.sp,\n                            textAlign = TextAlign.End\n                        )\n                    }'''
          if old not in s: raise SystemExit('Missing market return block')
          s = s.replace(old,new,1)

          old = '''                        FilterChip(selected = period == value, onClick = { period = value }, label = { Text(value, fontSize = 9.sp) })'''
          new = '''                        FilterChip(\n                            selected = period == value,\n                            onClick = { period = value },\n                            label = { Text(value, fontSize = 9.sp) },\n                            colors = FilterChipDefaults.filterChipColors(\n                                selectedContainerColor = IntelligenceGreen,\n                                selectedLabelColor = Color.White,\n                                selectedLeadingIconColor = Color.White\n                            ),\n                            border = FilterChipDefaults.filterChipBorder(\n                                enabled = true,\n                                selected = period == value,\n                                borderColor = IntelligenceMuted.copy(alpha = 0.65f),\n                                selectedBorderColor = IntelligenceGreen\n                            )\n                        )'''
          if old not in s: raise SystemExit('Missing filter chip block')
          s = s.replace(old,new,1)

          old = '''                Spacer(Modifier.height(10.dp))\n                if (historyLoading) {'''
          new = '''                Spacer(Modifier.height(8.dp))\n                Text(\n                    periodDescription(period),\n                    color = IntelligenceText,\n                    fontSize = 9.sp,\n                    fontWeight = FontWeight.SemiBold,\n                    modifier = Modifier.fillMaxWidth(),\n                    textAlign = TextAlign.Center\n                )\n                Spacer(Modifier.height(8.dp))\n                if (historyLoading) {'''
          if old not in s: raise SystemExit('Missing chart spacing block')
          s = s.replace(old,new,1)

          old = '''                    IntelligenceChart(history, if (s.change >= 0) IntelligenceGreen else IntelligenceRed)\n                    Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {\n                        Text("${history.size} data points", color = IntelligenceMuted, fontSize = 8.sp)\n                        percentReturn(history)?.let { Text("${formatSigned(it)} $period", color = if (it >= 0) IntelligenceGreen else IntelligenceRed, fontWeight = FontWeight.Bold, fontSize = 8.sp) }'''
          new = '''                    IntelligenceChart(history, if ((selectedPeriodReturn ?: s.change) >= 0) IntelligenceGreen else IntelligenceRed)\n                    Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {\n                        Text("${history.size} data points", color = IntelligenceMuted, fontSize = 8.sp)\n                        selectedPeriodReturn?.let { Text(formatPeriodReturn(period, it), color = if (it >= 0) IntelligenceGreen else IntelligenceRed, fontWeight = FontWeight.Bold, fontSize = 8.sp) }'''
          if old not in s: raise SystemExit('Missing chart result block')
          s = s.replace(old,new,1)

          marker = '''private fun percentReturn(values: List<Double>): Double? {'''
          helpers = '''private fun financialPeriodLabel(period: String): String {\n    val clean = period.trim()\n    if (clean.isBlank()) return "Annual figures • Latest reported period"\n    val date = Regex("([A-Z][a-z]{2} \\\\d{1,2}, \\\\d{4})$").find(clean)?.groupValues?.getOrNull(1)\n    return if (date != null) "Annual figures • FY ended $date" else "Annual figures • Latest reported period"\n}\n\nprivate fun periodDescription(period: String): String = when (period) {\n    "1D" -> "Today"\n    "1W" -> "Past 1 week"\n    "1M" -> "Past 1 month"\n    "3M" -> "Past 3 months"\n    "6M" -> "Past 6 months"\n    "1Y" -> "Past 1 year"\n    "3Y" -> "Past 3 years"\n    "5Y" -> "Past 5 years"\n    else -> period\n}\n\nprivate fun formatPeriodReturn(period: String, value: Double): String {\n    val label = when (period) {\n        "1D" -> "today"\n        "1W" -> "1 week"\n        "1M" -> "1 month"\n        "3M" -> "3 months"\n        "6M" -> "6 months"\n        "1Y" -> "1 year"\n        "3Y" -> "3 years"\n        "5Y" -> "5 years"\n        else -> period\n    }\n    return String.format(Locale.US, "%+.2f%% $label", value)\n}\n\n'''
          if marker not in s: raise SystemExit('Missing helper insertion point')
          s = s.replace(marker, helpers + marker, 1)
          p.write_text(s)
          PY
      - name: Commit focused edit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ke/co/nsewatcher/CompanyIntelligence.kt
          git commit -m "Update Company Intelligence period clarity"
          git push origin HEAD:main
